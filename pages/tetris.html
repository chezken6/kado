<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUP Game Console - Tetris</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .game-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            padding: 0;
            margin: 0;
        }

        .game-canvas {
            border: 3px solid #fff;
            border-radius: 6px;
            background: #000;
            margin: 2px auto 0;
            display: block;
            box-shadow: 0 5px 0 #2c3e50, 0 7px 12px rgba(0, 0, 0, 0.4);
            width: 200px;
            height: 280px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 2px 4px;
            font-size: 6px;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            width: 100%;
            gap: 2px;
        }

        .game-instructions {
            font-size: 4px;
            color: rgba(255, 255, 255, 0.8);
            margin: 1px 0 0 0;
            line-height: 1.2;
            font-family: 'Press Start 2P', cursive;
        }

        .game-container .title {
            font-size: 9px;
            margin-bottom: 1px;
            margin-top: 0;
        }

        /* Override console container for tetris */
        .console-container {
            min-height: 600px !important;
            height: auto !important;
            padding: 20px !important;
        }

        .screen {
            height: auto !important;
            flex: 0 1 auto;
        }

        .game-over-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 4px solid #9b59b6;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
        }

        .game-over-screen h2 {
            color: #9b59b6;
            font-size: 20px;
            margin-bottom: 15px;
            font-family: 'Press Start 2P', cursive;
        }

        .game-over-screen p {
            color: #fff;
            font-size: 12px;
            margin-bottom: 20px;
            font-family: 'Press Start 2P', cursive;
        }

        .restart-btn {
            background-color: #27ae60;
            border: 3px solid #fff;
            border-radius: 8px;
            padding: 12px 24px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e8449;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
        }

        .restart-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1e8449;
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e8449;
        }
    </style>
</head>

<body>
    <div class="console-container">
        <audio id="uiSound" src="../sounds/button_1.mp3"></audio>
        <audio id="controlSound" src="../sounds/klik.mp3"></audio>
        <audio id="musicPlayer"></audio>

        <div class="screen">
            <div class="screen-content game-container">
                <button class="back-button" data-link="games.html">
                    <span>← BACK</span>
                </button>

                <h1 class="title">TETRIS</h1>

                <div class="game-info">
                    <div>SCORE: <span id="score">0</span></div>
                    <div>LINES: <span id="lines">0</span></div>
                    <div>LEVEL: <span id="level">1</span></div>
                </div>

                <canvas id="gameCanvas" class="game-canvas" width="200" height="280"></canvas>

                <div class="game-instructions">
                    ← → : MOVE | ↑ : ROTATE | ↓ : DROP<br>
                    SPACE : HARD DROP | P : PAUSE
                </div>

                <div id="gameOverScreen" class="game-over-screen">
                    <h2>GAME OVER!</h2>
                    <p>FINAL SCORE: <span id="finalScore">0</span></p>
                    <p>LINES: <span id="finalLines">0</span></p>
                    <button class="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="dpad">
                <button class="dpad-button up" onclick="rotatePiece()">↑</button>
                <button class="dpad-button left" onclick="movePiece(-1)">←</button>
                <button class="dpad-button center"></button>
                <button class="dpad-button right" onclick="movePiece(1)">→</button>
                <button class="dpad-button down" onclick="moveDown()">↓</button>
            </div>

            <div class="action-buttons">
                <button class="action-btn" onclick="hardDrop()">A</button>
                <button class="action-btn" onclick="togglePause()">B</button>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const controlSound = document.getElementById('controlSound');
        const uiSound = document.getElementById('uiSound');

        // Game constants
        const BLOCK_SIZE = 20;
        const ROWS = 14;
        const COLS = 10;
        const COLORS = ['#000', '#e74c3c', '#3498db', '#f39c12', '#2ecc71', '#9b59b6', '#1abc9c', '#e67e22'];

        // Tetromino shapes
        const SHAPES = [
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 0, 0], [1, 1, 1]], // L
            [[0, 0, 1], [1, 1, 1]], // J
            [[0, 1, 1], [1, 1, 0]], // S
            [[1, 1, 0], [0, 1, 1]]  // Z
        ];

        // Game state
        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let currentPiece = null;
        let currentX = 0;
        let currentY = 0;
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameRunning = false;
        let gameLoop;
        let dropInterval = 800;
        let isPaused = false;

        function playSound(sound) {
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(err => console.error(err));
            }
        }

        function createPiece() {
            const shapeIndex = Math.floor(Math.random() * SHAPES.length);
            const shape = SHAPES[shapeIndex];
            const color = shapeIndex + 1;

            return {
                shape: shape,
                color: color
            };
        }

        function spawnPiece() {
            currentPiece = createPiece();
            currentX = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
            currentY = 0;

            if (checkCollision(currentPiece.shape, currentX, currentY)) {
                gameOver();
            }
        }

        function checkCollision(shape, x, y) {
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col]) {
                        const newX = x + col;
                        const newY = y + row;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function mergePiece() {
            for (let row = 0; row < currentPiece.shape.length; row++) {
                for (let col = 0; col < currentPiece.shape[row].length; col++) {
                    if (currentPiece.shape[row][col]) {
                        const y = currentY + row;
                        if (y >= 0) {
                            board[y][currentX + col] = currentPiece.color;
                        }
                    }
                }
            }
        }

        function rotatePiece() {
            if (!gameRunning || isPaused) return;

            const rotated = currentPiece.shape[0].map((_, i) =>
                currentPiece.shape.map(row => row[i]).reverse()
            );

            if (!checkCollision(rotated, currentX, currentY)) {
                currentPiece.shape = rotated;
                draw();
            }
        }

        function movePiece(dir) {
            if (!gameRunning || isPaused) return;

            const newX = currentX + dir;
            if (!checkCollision(currentPiece.shape, newX, currentY)) {
                currentX = newX;
                draw();
            }
        }

        function moveDown() {
            if (!gameRunning || isPaused) return;

            if (!checkCollision(currentPiece.shape, currentX, currentY + 1)) {
                currentY++;
                draw();
            } else {
                lockPiece();
            }
        }

        function hardDrop() {
            if (!gameRunning || isPaused) return;

            while (!checkCollision(currentPiece.shape, currentX, currentY + 1)) {
                currentY++;
            }
            playSound(uiSound);
            lockPiece();
        }

        function lockPiece() {
            mergePiece();
            clearLines();
            spawnPiece();
            draw();
        }

        function clearLines() {
            let linesCleared = 0;

            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell !== 0)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    row++; // Check the same row again
                }
            }

            if (linesCleared > 0) {
                lines += linesCleared;
                score += linesCleared * linesCleared * 100 * level;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 800 - (level - 1) * 50);

                document.getElementById('score').textContent = score;
                document.getElementById('lines').textContent = lines;
                document.getElementById('level').textContent = level;

                playSound(uiSound);

                clearInterval(gameLoop);
                gameLoop = setInterval(update, dropInterval);
            }
        }

        function update() {
            if (isPaused) return;

            if (!checkCollision(currentPiece.shape, currentX, currentY + 1)) {
                currentY++;
            } else {
                lockPiece();
            }
            draw();
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw board
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (board[row][col]) {
                        ctx.fillStyle = COLORS[board[row][col]];
                        ctx.fillRect(
                            col * BLOCK_SIZE + 1,
                            row * BLOCK_SIZE + 1,
                            BLOCK_SIZE - 2,
                            BLOCK_SIZE - 2
                        );
                    }
                }
            }

            // Draw current piece
            if (currentPiece) {
                ctx.fillStyle = COLORS[currentPiece.color];
                for (let row = 0; row < currentPiece.shape.length; row++) {
                    for (let col = 0; col < currentPiece.shape[row].length; col++) {
                        if (currentPiece.shape[row][col]) {
                            ctx.fillRect(
                                (currentX + col) * BLOCK_SIZE + 1,
                                (currentY + row) * BLOCK_SIZE + 1,
                                BLOCK_SIZE - 2,
                                BLOCK_SIZE - 2
                            );
                        }
                    }
                }
            }

            // Draw pause text
            if (isPaused) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.font = '20px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }

        function togglePause() {
            if (gameRunning) {
                isPaused = !isPaused;
                playSound(uiSound);
                draw();
            }
        }

        function startGame() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 800;
            isPaused = false;

            document.getElementById('score').textContent = score;
            document.getElementById('lines').textContent = lines;
            document.getElementById('level').textContent = level;

            spawnPiece();
            gameRunning = true;
            gameLoop = setInterval(update, dropInterval);
            draw();
        }

        function gameOver() {
            clearInterval(gameLoop);
            gameRunning = false;

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLines').textContent = lines;
            document.getElementById('gameOverScreen').style.display = 'block';
        }

        function restartGame() {
            playSound(uiSound);
            document.getElementById('gameOverScreen').style.display = 'none';
            startGame();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) {
                if (e.key === ' ' || e.key.startsWith('Arrow')) {
                    startGame();
                }
                return;
            }

            switch (e.key) {
                case 'ArrowLeft':
                    movePiece(-1);
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    movePiece(1);
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    moveDown();
                    e.preventDefault();
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    e.preventDefault();
                    break;
                case ' ':
                    hardDrop();
                    e.preventDefault();
                    break;
                case 'p':
                case 'P':
                    togglePause();
                    break;
            }
        });

        // Initialize
        draw();

        // Auto-start message
        setTimeout(() => {
            if (!gameRunning) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.font = '12px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText('PRESS ANY KEY', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText('TO START', canvas.width / 2, canvas.height / 2 + 20);
            }
        }, 100);
    </script>
    <script>
        // Control button visual effects and sound
        document.querySelectorAll('.dpad-button, .action-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Visual effect
                btn.style.transform = 'scale(0.90)';
                setTimeout(() => {
                    btn.style.transform = '';
                }, 100);

                // Sound logic is handled by specific onclick attributes or key listeners in Tetris, 
                // but let's add generic click sound for non-functional buttons if any, 
                // or just rely on the onclick attributes which call playSound/controlSound directly.
                // Actually, Tetris uses onclick="rotatePiece()" etc which call playSound.
                // So here we only need visual effect.
            });
        });
    </script>
</body>

</html>
