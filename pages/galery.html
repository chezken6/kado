<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUP Game Console - Galeri</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            padding: 8px;
        }

        .photo-item {
            aspect-ratio: 1;
            background: #2d3436;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
        }

        .photo-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-label {
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            text-align: center;
            font-size: 6px;
            padding: 2px;
            font-family: 'Press Start 2P', cursive;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .photo-item:hover .photo-label {
            opacity: 1;
        }

        /* Lightbox Modal */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            background: #000;
            border: 4px solid #fff;
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #ff4757;
            border: 2px solid #fff;
            border-radius: 4px;
            padding: 4px 8px;
            color: #fff;
            font-size: 6px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            z-index: 2001;
        }

        .lightbox-close:hover {
            background-color: #ff3838;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 75, 87, 0.8);
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            color: #fff;
            font-size: 8px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            z-index: 2001;
        }

        .lightbox-nav:hover {
            background-color: #ff4757;
        }

        .lightbox-prev {
            left: 8px;
        }

        .lightbox-next {
            right: 8px;
        }

        .lightbox-counter {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 6px;
            font-family: 'Press Start 2P', cursive;
            z-index: 2001;
        }
    </style>
</head>

<body>
    <div class="console-container">
        <audio id="uiSound" src="../sounds/button_1.mp3"></audio>
        <audio id="controlSound" src="../sounds/klik.mp3"></audio>
        <audio id="musicPlayer"></audio>
        <div class="screen">
            <div class="screen-content">
                <button class="back-button" data-link="index.html">
                    <span>← HOME</span>
                </button>

                <h1 class="title">GALERI</h1>

                <div class="gallery-grid" id="galleryGrid">
                    <!-- Gallery items will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="dpad">
                <button class="dpad-button up">↑</button>
                <button class="dpad-button left">←</button>
                <button class="dpad-button center"></button>
                <button class="dpad-button right">→</button>
                <button class="dpad-button down">↓</button>
            </div>

            <div class="action-buttons">
                <button class="action-btn">A</button>
                <button class="action-btn">B</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="lightbox-modal">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">✕</button>
            <img id="lightboxImage" class="lightbox-image" src="" alt="Gallery Image">
            <button class="lightbox-nav lightbox-prev" onclick="previousImage()">❮</button>
            <button class="lightbox-nav lightbox-next" onclick="nextImage()">❯</button>
            <div class="lightbox-counter">
                <span id="imageCounter">1 / 6</span>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        const images = [
            '../images/img1.png',
            '../images/img2.png',
            '../images/img3.png',
            '../images/img4.png',
            '../images/img5.png',
            '../images/img6.png'
        ];

        let currentImageIndex = 0;

        // Generate gallery grid
        function initGallery() {
            const galleryGrid = document.getElementById('galleryGrid');
            images.forEach((img, index) => {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                photoItem.onclick = () => openLightbox(index);

                const img_element = document.createElement('img');
                img_element.src = img;
                img_element.alt = `Foto ${index + 1}`;

                const label = document.createElement('span');
                label.className = 'photo-label';
                label.textContent = `Foto ${index + 1}`;

                photoItem.appendChild(img_element);
                photoItem.appendChild(label);
                galleryGrid.appendChild(photoItem);
            });
        }

        function openLightbox(index) {
            currentImageIndex = index;
            const modal = document.getElementById('lightboxModal');
            const lightboxImage = document.getElementById('lightboxImage');
            const counter = document.getElementById('imageCounter');

            lightboxImage.src = images[currentImageIndex];
            counter.textContent = `${currentImageIndex + 1} / ${images.length}`;
            modal.classList.add('active');

            // Play sound
            const uiSound = document.getElementById('uiSound');
            if (uiSound) {
                uiSound.currentTime = 0;
                uiSound.play().catch(err => console.error(err));
            }
        }

        function closeLightbox() {
            const modal = document.getElementById('lightboxModal');
            modal.classList.remove('active');

            // Play sound
            const uiSound = document.getElementById('uiSound');
            if (uiSound) {
                uiSound.currentTime = 0;
                uiSound.play().catch(err => console.error(err));
            }
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            updateLightbox();
        }

        function previousImage() {
            currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
            updateLightbox();
        }

        function updateLightbox() {
            const lightboxImage = document.getElementById('lightboxImage');
            const counter = document.getElementById('imageCounter');

            lightboxImage.src = images[currentImageIndex];
            counter.textContent = `${currentImageIndex + 1} / ${images.length}`;

            // Play sound
            const controlSound = document.getElementById('controlSound');
            if (controlSound) {
                controlSound.currentTime = 0;
                controlSound.play().catch(err => console.error(err));
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('lightboxModal');
            if (!modal.classList.contains('active')) return;

            if (e.key === 'ArrowLeft') previousImage();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'Escape') closeLightbox();
        });

        // Initialize gallery on page load
        window.addEventListener('load', initGallery);
    </script>
</body>

</html>
